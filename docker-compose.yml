name: lojinha-ux

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lojinha
      POSTGRES_PASSWORD: lojinha
      POSTGRES_DB: lojinha
    ports:
      - "5433:5432"
    volumes:
      - ./api/banco:/docker-entrypoint-initdb.d

  # Armazenamento de imagens compatível com S3 (tema Imagens com signed URL).
  # Console: http://localhost:9001 (lojinha / lojinha123)
  minio:
    # Fork mantido do MinIO: a imagem oficial saiu do Docker Hub em 2025.
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lojinha
      MINIO_ROOT_PASSWORD: lojinha123
    ports:
      - "9000:9000"
      - "9001:9001"
